# Cloudflare Pages project config (used by `wrangler pages dev/deploy` and by Git-connected builds).
name = "taxlead"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"

# Stores the client list, scripts and logo images.
# Create it once with:  npx wrangler kv namespace create SITE
# then paste the printed id below.
[[kv_namespaces]]
binding = "SITE"
id = "bea62634a60241fca791df57c22dd1a6"
